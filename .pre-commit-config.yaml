# pre-commit (#76): `uv run pre-commit install` once, then these run on each
# commit. Local hooks through uv, so they use the versions in uv.lock, the
# same ones CI runs, rather than a second set pinned here.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types: [python]
      # mypy reads its files from pyproject.toml, so it checks fpl/, tools/ and
      # tests/ whole rather than only the files staged; and it runs when its
      # config or the versions it checks against change, not only the Python.
      - id: mypy
        name: mypy
        entry: uv run --locked mypy
        language: system
        files: ^((fpl|tools|tests)/.*\.py|pyproject\.toml|uv\.lock)$
        pass_filenames: false
      # The site, with the versions in web/package-lock.json (`npm ci` in web/
      # first). Prettier fixes what it can; ESLint only reports.
      - id: prettier
        name: prettier (web)
        entry: bash -c 'cd web && { test -d node_modules || { echo "web/node_modules is missing - run npm ci in web/ first"; exit 1; }; } && npx --no-install prettier --write --ignore-unknown "${@#web/}"' --
        language: system
        files: ^web/
      - id: eslint
        name: eslint (web)
        entry: bash -c 'cd web && { test -d node_modules || { echo "web/node_modules is missing - run npm ci in web/ first"; exit 1; }; } && npx --no-install eslint .'
        language: system
        # Its dependencies too: a new rule arrives with a bump, not an edit.
        files: ^web/(.*\.(ts|tsx|js|mjs)|package(-lock)?\.json)$
        pass_filenames: false
