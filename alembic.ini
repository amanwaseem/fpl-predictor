# Alembic: schema migrations for the database (#77).
#
#   make migrate              # alembic upgrade head, against DATABASE_URL
#   alembic revision --autogenerate -m "what changed"
#
# The database URL is not set here: fpl/db/migrations/env.py reads DATABASE_URL,
# so no credentials are ever written into the repository.

[alembic]
# Inside the package, so the migrations ship with it and a deployed image can
# run them without a checkout.
script_location = %(here)s/fpl/db/migrations
prepend_sys_path = .
path_separator = os
# Revisions are numbered in order (0001_initial_schema.py), not by random hash,
# so the directory reads as the schema's history.
file_template = %%(rev)s_%%(slug)s

# Generated revisions are formatted and import-sorted as they are written.
[post_write_hooks]
hooks = format, lint
format.type = exec
format.executable = ruff
format.options = format REVISION_SCRIPT_FILENAME
lint.type = exec
lint.executable = ruff
lint.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
