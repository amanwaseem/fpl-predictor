# Dependency updates, by GitHub's own Dependabot: once a month, one grouped PR
# per ecosystem, merged by hand once CI passes, and never in the days before a
# deadline. Security fixes arrive as they are published, through the
# repository's Dependabot security updates, not on this schedule.
version: 2
updates:
  # pyproject.toml and uv.lock: every group, the runtime included.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    ignore:
      # Node's types follow the Node the site runs on (web/.nvmrc), not the
      # newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the native compiler: a migration of its own, once the
      # tools around it (openapi-typescript, typescript-eslint) accept it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      web:
        patterns: ["*"]

  # The workflows and the composite action they share.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # The image's base images. Python stays on 3.13 (3.14 is a minor version to
  # semver) and Node on 24, as pyproject.toml and web/.nvmrc pin them. uv is
  # pinned here and in .github/actions/uv together, so it is bumped by hand.
  #
  # Also by hand: postgres:17.6, pinned in docker-compose.yml and in ci.yml's
  # service containers, which Dependabot cannot update. The three move
  # together, on Neon's major version.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "*astral-sh/uv"
    groups:
      docker:
        patterns: ["*"]
