# Loads the past seasons into production, by hand (#79, ADR 0018). Run once,
# and again only when fpl/ingest/history.py moves to a new archive commit:
# each season replaces itself, so a second run changes nothing.
#
# Secret, in the `production` environment: DATABASE_URL (docs/deploy.md).
name: Backfill

on:
  workflow_dispatch:

permissions:
  actions: read   # whether a deploy is running
  contents: read

# Never beside the ingest's load: one at a time. A deploy has its own group,
# so this waits for one on its way instead, as the ingest does (#165).
concurrency:
  group: ingest
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Wait for any deploy in progress
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            ci=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
                   --event push --limit 10 --json status \
                   --jq '[.[] | select(.status != "completed")] | length') || ci=unknown
            deploy=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --limit 10 \
                   --json status --jq '[.[] | select(.status != "completed")] | length') || deploy=unknown
            [ "$ci" = "0" ] && [ "$deploy" = "0" ] && exit 0
            echo "CI on main: $ci running, deploys: $deploy running; waiting ($i/40)."
            sleep 30
          done
          echo "::error::A deploy has been on its way for 20 minutes. Not loading beside it."
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Check the database URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python3 tools/check_database_url.py \
            || { echo "::error::The production DATABASE_URL cannot be used. See docs/deploy.md."; exit 1; }
      - uses: ./.github/actions/uv
        with:
          args: "--no-dev --group db"
      - run: fpl-backfill --download-only
      - name: The schema is at this code's head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: fpl-stale --schema-only
      - name: Load every past season
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: fpl-backfill | tee -a "$GITHUB_STEP_SUMMARY"
      # A season backfilled again loses its features; this builds what is
      # missing or out of date (#84).
      - name: Build the feature table
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: fpl-features | tee -a "$GITHUB_STEP_SUMMARY"
