# Warns before a gameweek deadline passes with no entry for it (#46). GW5 was
# missed while nobody was working, and ci.yml only runs on pushes and PRs — so
# it is silent exactly then. See tools/check_deadline.py.
#
# Since #68 the entry workflow (entry.yml) makes the entry and opens its PR
# from 12 hours out. This is its alarm: hourly, it fails when the deadline is
# 10 hours away or less and main has no entry, and says whether to merge an
# open PR or make the entry by hand. GitHub's failed-workflow email is the
# alert. Firing any earlier would go red before every gameweek by design.
#
# Once a day it also checks ENTRY_BOT_TOKEN, the token the entry workflow
# opens its PR with. Fine-grained tokens always expire; a week's warning
# leaves time to replace it before a run needs it.
#
# Separate from ci.yml so it never touches the required `ci` check. It only
# reads: bootstrap-static from the API, the names in predictions/ and the open
# PRs. Nothing is snapshotted, written, or opened.
#
# GitHub disables scheduled workflows after 60 days with no commits to the
# repository. Mid-season that cannot happen; at the start of a season, check
# the Actions tab that it is still enabled.
name: Deadline watchdog

on:
  schedule:
    - cron: "5 * * * *"   # the deadline, hourly
    - cron: "0 7 * * *"   # the token, daily
  workflow_dispatch:
    inputs:
      fake_deadline_hours:
        description: "Test only: pretend the next deadline is this many hours away (blank = read the API)"
        required: false
        default: ""
      fake_gameweek:
        description: "Test only: the gameweek of the fake deadline"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    shell: bash

jobs:
  deadline:
    if: github.event_name != 'schedule' || github.event.schedule == '5 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml
      - run: pip install -r requirements.txt
      - name: Check the next deadline has an entry
        env:
          GH_TOKEN: ${{ github.token }}
          FAKE_HOURS: ${{ inputs.fake_deadline_hours }}
          FAKE_GW: ${{ inputs.fake_gameweek }}
        run: |
          gh pr list --state open --limit 200 --json number,state,headRefName,files > "$RUNNER_TEMP/prs.json"
          if [ -n "$FAKE_HOURS" ]; then
            python tools/check_deadline.py --prs "$RUNNER_TEMP/prs.json" \
              --fake-deadline-hours "$FAKE_HOURS" --fake-gameweek "$FAKE_GW"
          else
            python tools/check_deadline.py --prs "$RUNNER_TEMP/prs.json"
          fi

  token:
    if: github.event_name != 'schedule' || github.event.schedule == '0 7 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml
      - run: pip install -r requirements.txt
      - name: ENTRY_BOT_TOKEN is set, valid, and not about to expire
        env:
          GH_TOKEN: ${{ secrets.ENTRY_BOT_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "ENTRY_BOT_TOKEN is not set: the entry workflow cannot open its PR."
            echo 'Add it under Settings > Secrets and variables > Actions. RUNBOOK.md, "The automated entry".'
            exit 1
          fi
          { gh api -i "repos/$GITHUB_REPOSITORY" 2>/dev/null || true; } | python tools/entry_bot.py token-expiry --fail-days 7
