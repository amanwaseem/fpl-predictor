# Loads the football data into production every day, so nobody has to run
# fpl-load by hand after each gameweek (#93). The deploy copies the committed
# log; teams, players, fixtures, results and which gameweeks have settled come
# from snapshots, which are not in git (rule 3), so this is the only way they
# reach the production database.
#
#   1. Wait out any deploy on its way (CI on main, or Deploy running), then
#      check out main and check the production DATABASE_URL, as the deploy
#      does.
#   2. Take a bootstrap-only snapshot (seconds) and compare it with the
#      database (fpl-stale). Most days nothing has changed, and the run
#      stops here, without one request per player to an undocumented API.
#      It stops with an error if the schema is behind this code, which
#      happens while a deploy is still to migrate it.
#   3. Otherwise take a full snapshot (about six minutes), check the schema
#      again, and load it (fpl-load).
#
# The loader is idempotent and newest-wins (#78): a snapshot already loaded
# changes nothing, and an older one only fills gaps. A mid-gameweek snapshot is
# safe for the same reason: stats come only from finished fixtures, and bonus
# is overwritten by the next load once data_checked is true.
#
# It writes nothing to the repository; the snapshot stays in the runner and is
# discarded with it. It is independent of the entry workflow (entry.yml), whose
# snapshot is evidence for a log entry and is released beside it. Sharing one
# would tie the ingest to entry days and the entry to a database it does not
# need.
#
# It does not share the deploy's concurrency group: GitHub keeps one pending
# run per group and cancels the older, so a queued ingest could cancel a queued
# deploy. It waits for a deploy on its way in step 1 instead.
#
# Secret, in the `production` environment: DATABASE_URL, the same one the
# deploy uses (docs/deploy.md).
name: Ingest

on:
  schedule:
    # Daily, early UTC: data_checked usually flips overnight after a gameweek's
    # last match. Off the top of the hour, when scheduled runs queue longest.
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Load even if the database already agrees with the API"
        type: boolean
        default: false

permissions:
  actions: read   # whether a deploy is running
  contents: read

# One load at a time. A second run waits rather than cancelling the first: a
# cancelled load rolls back cleanly (one transaction), but there is no reason
# to throw away six minutes of fetching.
concurrency:
  group: ingest
  cancel-in-progress: false

# bash -eo pipefail, so a failing command in a pipe fails its step.
defaults:
  run:
    shell: bash

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      # Before the checkout, so the code checked out is what the finished
      # deploy migrated the schema for. A deploy starts when CI on main
      # passes, so CI on main counts as a deploy on its way.
      - name: Wait for any deploy in progress
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            ci=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
                   --event push --limit 10 --json status \
                   --jq '[.[] | select(.status != "completed")] | length') || ci=unknown
            deploy=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --limit 10 \
                   --json status --jq '[.[] | select(.status != "completed")] | length') || deploy=unknown
            [ "$ci" = "0" ] && [ "$deploy" = "0" ] && exit 0
            echo "CI on main: $ci running, deploys: $deploy running; waiting ($i/40)."
            sleep 30
          done
          echo "::error::A deploy has been on its way for 20 minutes. Not loading beside it."
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Check the database URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Prints nothing from the URL (#94).
          python3 tools/check_database_url.py \
            || { echo "::error::The production DATABASE_URL cannot be used. See the message above and docs/deploy.md."; exit 1; }

      # uv.lock, exactly (#76); .venv/bin on PATH so the commands run as before.
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.0"
          python-version: "3.13"
          enable-cache: true
      - run: |
          uv sync --frozen --no-dev --group db
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Snapshot the bootstrap and fixtures
        run: fpl-fetch --skip-players

      - name: Compare them with the database
        id: stale
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # The summary gets the reason even when it refuses.
          status=0
          fpl-stale > "$RUNNER_TEMP/stale.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/stale.txt"
          { echo '```'; cat "$RUNNER_TEMP/stale.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Snapshot the FPL API in full
        if: steps.stale.outputs.needed == 'true' || inputs.force
        run: fpl-fetch

      - name: Load the snapshot into production
        if: steps.stale.outputs.needed == 'true' || inputs.force
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Again: the full fetch took minutes, and main may have moved.
          status=0
          { fpl-stale --schema-only && fpl-load; } > "$RUNNER_TEMP/load.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/load.txt"
          { echo '```'; cat "$RUNNER_TEMP/load.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
