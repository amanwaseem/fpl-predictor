# Lints, runs the test suite and checks hard rule 1 on every PR and every push
# to main, so none of it depends on someone remembering to run it. See #26, #6.
#
# Branch protection requires one check, `ci`, which passes only when every
# other job did. Jobs can be added or renamed here without touching the
# repository settings — and the matrix's per-OS names never have to be listed
# there one by one.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded PR runs are cancelled; pushes to main never are. Each push's rule 1
# check compares against the commit before it, so a cancelled run leaves that
# push's changes to predictions/ unexamined — the next push treats them as the
# baseline.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml
      - run: pip install -r requirements-dev.txt
      # GitHub format annotates the offending lines on the PR diff.
      - run: ruff check --output-format=github .

  # Every real log entry is produced on macOS, so the suite runs there as well
  # as on Linux. One Python only: 3.13 is pinned so an entry can be reproduced
  # from the environment that made it, and a second version would argue
  # against the pin rather than test it.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml
      # requirements.txt ends in `-e .`, so this installs the package too.
      - run: pip install -r requirements-dev.txt
      # As a user would meet it: from outside the repository, the package
      # imports and every command answers --help — and a command that would
      # touch data/raw or predictions/ refuses there, leaving nothing behind.
      - name: Commands work from outside the repository, and refuse to run there
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          mkdir elsewhere && cd elsewhere
          python -c "import fpl.predict_fixture"
          for command in $(python -c "import tomllib; print(*tomllib.load(open('$GITHUB_WORKSPACE/pyproject.toml', 'rb'))['project']['scripts'])"); do
            "$command" --help > /dev/null && echo "$command --help ok"
          done
          if fpl-predict-baseline --gw 6; then
            echo "fpl-predict-baseline ran outside the repository root"; exit 1
          fi
          [ -z "$(ls -A)" ] || { echo "a refused command left files behind:"; ls -A; exit 1; }
      - run: coverage run -m unittest discover tests
      # Reported, not gated — see [tool.coverage] in pyproject.toml.
      - name: Coverage report
        run: |
          coverage combine
          echo "### Coverage (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  log-immutable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history: the check reads the committed log at a reference commit,
      # not just the working tree.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The reference is what makes the check mean anything. On a PR it is the
      # branch being merged into. On a push to main it is the commit main
      # pointed at before the push — comparing main against origin/main would
      # compare it with itself and always pass. A force-push that rewrote the
      # log leaves `before` unreachable; it is fetched explicitly, and if that
      # fails the check fails closed rather than skipping.
      - name: Check committed predictions are unchanged (rule 1)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            ref="origin/$BASE_REF"
          elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "Branch created by this push; no earlier log to compare against."
            exit 0
          else
            git fetch --quiet origin "$BEFORE" || true
            ref="$BEFORE"
          fi
          echo "Comparing predictions/ against $ref"
          python tools/check_log_immutable.py --ref "$ref"

  # The one required check. `always()` makes it run, and fail, when a job it
  # needs failed or was cancelled — without it a failed dependency would skip
  # this job, and a skipped required check counts as passing.
  ci:
    if: always()
    needs: [lint, test, log-immutable]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "a required job did not succeed"; exit 1; }
          done
