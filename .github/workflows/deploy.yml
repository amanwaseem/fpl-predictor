# Deploys the API to Fly.io after CI passes on main (#82). docs/deploy.md has
# the one-time setup: the Fly app, the Neon database, and the secrets below.
#
#   1. Deploy the image. fly.toml's release command, fpl-migrate, brings the
#      schema to head first; a failed migration stops the deploy, and the
#      running version keeps serving.
#   2. Project the committed log into the production database and reconcile
#      it, so the API serves exactly what is in git at this commit.
#   3. Smoke-test the live URL: /readyz, then the scorecard.
#
# Secrets, in the `production` environment: FLY_API_TOKEN (a deploy token for
# the app) and DATABASE_URL (Neon's direct connection string). The same
# DATABASE_URL is set on the Fly app with `fly secrets set`.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read   # newer commits' CI runs
  contents: read

# One deploy at a time, and never cancelled part-way: a cancelled deploy can
# leave the schema migrated under the previous version's code.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only a CI run for a push to main, and only a green one. A PR's CI run on
    # a branch named main does not count.
    # A manual deploy is of main only: from a branch it would put unmerged code
    # and log entries in production (#165).
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 40  # up to 20 waiting on a newer commit's CI, then the deploy
    environment: production
    steps:
      # The commit CI tested, not whatever main has moved to since.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # CI runs on two pushes can finish out of order, and this run may have
      # queued behind a newer deploy. A newer commit on main whose CI passed
      # deploys itself (or already has), so this one stands down rather than
      # put older code back. If every newer commit's CI failed, this is the
      # newest green one, and it deploys. While a newer one's CI is still
      # running, it waits to see (#165). Only commits with a CI run count: a
      # rebase merge pushes several, and CI runs on the last.
      - name: No newer commit on main has passed CI
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          ci() {
            gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event push --commit "$1" \
              --limit 1 --json status,conclusion -q '.[0] | "\(.status) \(.conclusion)"'
          }
          for i in $(seq 1 40); do
            tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" -q .sha)
            [ "$tip" = "$SHA" ] && { echo "$SHA is main's newest commit."; exit 0; }
            pending=0
            for c in $(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...$tip" -q '.commits[].sha'); do
              state=$(ci "$c")
              case "$state" in
                "completed success")
                  echo "$c, newer, passed CI and deploys itself. Not deploying $SHA."
                  echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
                "completed "*) ;;
                "") [ "$c" = "$tip" ] && pending=1 ;;  # main's head: its run is on its way
                *) pending=1 ;;
              esac
            done
            [ "$pending" = "0" ] && { echo "Every newer commit failed CI: $SHA is the newest green one."; exit 0; }
            echo "A newer commit's CI is still running; waiting ($i/40)."
            sleep 30
          done
          echo "::error::A newer commit's CI has run for 20 minutes. Not deploying $SHA over it; re-run this deploy if it fails."
          exit 1

      - name: Check the deploy is configured
        if: steps.newest.outputs.skip != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          missing=""
          [ -n "$FLY_API_TOKEN" ] || missing="$missing FLY_API_TOKEN"
          [ -n "$DATABASE_URL" ] || missing="$missing DATABASE_URL"
          if [ -n "$missing" ]; then
            echo "::error::Not set in the production environment:$missing. See docs/deploy.md."
            exit 1
          fi
          # Its shape, before Fly is touched: a malformed URL stops here with
          # the reason, not later with a DNS error from the release machine
          # (#94). Prints nothing from the URL.
          python3 tools/check_database_url.py \
            || { echo "::error::The production DATABASE_URL cannot be used. See the message above and docs/deploy.md."; exit 1; }
          app=$(sed -n 's/^app = "\(.*\)"$/\1/p' fly.toml)
          echo "APP_URL=https://$app.fly.dev" >> "$GITHUB_ENV"

      # 1.6, pinned by commit rather than by a tag that can be moved.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        if: steps.newest.outputs.skip != 'true'

      - name: Deploy, migrating first
        if: steps.newest.outputs.skip != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --wait-timeout 300

      - uses: ./.github/actions/uv
        if: steps.newest.outputs.skip != 'true'
        with:
          args: "--no-dev --group db"

      - name: Project the committed log into production, and reconcile it
        if: steps.newest.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          fpl-project
          fpl-reconcile

      - name: Smoke-test the live API
        if: steps.newest.outputs.skip != 'true'
        run: |
          for i in $(seq 1 20); do
            curl -sf "$APP_URL/readyz" > /dev/null && break
            sleep 3
          done
          curl -sf "$APP_URL/readyz"
          echo
          curl -sf "$APP_URL/v1/scorecard" | python -c '
          import json, sys
          card = json.load(sys.stdin)
          assert card["models"], "the scorecard lists no models"
          for model in card["models"]:
              print(model["model_version"], "scored", model["gameweeks_scored"],
                    "missed", model["gameweeks_missed"])
          '
          echo "Live at $APP_URL/docs" >> "$GITHUB_STEP_SUMMARY"
