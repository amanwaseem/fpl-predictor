# The CI fuzz of the API (#81), and how two routes depart from it (#83).

# A random squad that fits the schema is still almost never fifteen distinct
# players in legal positions, which no JSON schema can say, so most are refused
# with a 422 that names why. So a 422 counts as accepting it; every other
# check still applies. (`enabled = false` here is overridden by the CLI's
# --checks all.)
[[operations]]
include-path = "/v1/optimise"
checks.positive_data_acceptance.expected-statuses = ["2xx", "404", "422", "429", "5xx"]

# Reads a manager's squad from the FPL API: not fuzzed from CI, which would
# send the real API a request for every random team id. Tested against canned
# responses in tests/db/test_db_optimise.py.
[[operations]]
include-path = "/v1/entries/{fpl_team_id}/advice"
enabled = false

# Team news reads FPL's bootstrap-static: not fuzzed from CI, which would then
# fail whenever FPL is down or refuses the runner. Tested against canned
# responses in tests/api/test_news.py and tests/db/test_db_news.py (#196).
[[operations]]
include-path = "/v1/news"
enabled = false

# Live points read the FPL API, and with ?team= a manager's picks: not fuzzed
# from CI, which would send FPL a request for every random team id and fail
# whenever FPL is down. Tested against recorded responses in
# tests/api/test_live.py and tests/db/test_db_live.py (#199).
[[operations]]
include-path = "/v1/live/{gameweek}"
enabled = false
