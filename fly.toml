# The API on Fly.io (#82). Deployed by .github/workflows/deploy.yml after CI
# passes on main; set up once by following docs/deploy.md.
#
# `app` is the one setting to change: Fly app names are global, so pick one
# that is free. The deploy workflow reads it from here.
app = "fpl-predictor"
# San Jose: Fly's nearest region to the maintainer in western Canada (it has
# no Seattle), and about 20ms from Neon's AWS us-west-2 (Oregon), the nearest
# Neon region to it.
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

# Runs in a one-off machine from the new image before any new machine takes
# traffic. If a migration fails, the deploy stops and the old version keeps
# serving.
[deploy]
  release_command = "fpl-migrate"
  strategy = "rolling"

[http_service]
  internal_port = 8000
  force_https = true
  # Stops when idle and starts on the next request: a read API with weekly
  # data does not need a machine running at 3am.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  # /healthz rather than /readyz: Neon's free tier suspends an idle database,
  # and a check that queried it every 30 seconds would keep it awake. The
  # deploy smoke-tests /readyz instead.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
