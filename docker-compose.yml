# Local services. `docker compose up` starts both; `make up` starts only the
# database, for running commands against it from the host. `make down` stops
# them and keeps the data.
#
# The API reads the database; it does not migrate it. Run `make migrate seed`
# from the host first.

services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_USER: fpl
      POSTGRES_PASSWORD: fpl
      POSTGRES_DB: fpl
    ports:
      - "${FPL_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on an empty volume: creates fpl_test beside fpl.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fpl", "-d", "fpl"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://fpl:fpl@db:5432/fpl
    ports:
      - "${FPL_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
