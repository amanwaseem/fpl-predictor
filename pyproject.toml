# The package and its tooling config. Exact versions, transitive ones
# included, are in uv.lock, which every log entry's reproducibility claim
# rests on: `uv sync --locked` installs exactly what the lock says, and fails
# if the lock no longer matches this file. The project itself is installed
# editable, the only supported install (ADR 0011).

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# fpl/paths.py recognises the repository root by this name, and
# tests/test_paths.py fails if the two drift apart.
name = "fpl-predictor"
version = "0.1.0"
description = "FPL points predictor with an append-only public prediction log"
readme = "README.md"
license = "MIT"
# One Python, as in CI: 3.13 is pinned so an entry can be reproduced from the
# environment that made it.
requires-python = "==3.13.*"
dependencies = ["requests>=2.34,<3"]

# Dependency groups (#76). A prediction needs only `dependencies` above:
# `uv sync --no-dev` installs requests and nothing else, so the runtime that
# makes a log entry stays as small as it was. Everything else is a group:
#
#   uv sync                          # dev: everything, with the test tools
#   uv sync --no-dev                 # a prediction
#   uv sync --no-dev --group db      # the database commands
#   uv sync --no-dev --group api     # the API, with the solver it runs
#
# `uv sync` is exact: it removes what the groups named do not include. To add
# one group to an environment, name every group it needs, or pass --inexact.
[dependency-groups]
# The database layer (#77).
db = ["sqlalchemy>=2.0,<2.1", "alembic>=1.20,<2", "psycopg[binary]>=3.3,<4"]
# The squad optimiser (#53).
optimise = ["highspy>=1.15,<2"]
# The API (#81), with the solver /v1/optimise runs (#83).
api = [{include-group = "db"}, {include-group = "optimise"},
       "fastapi>=0.159,<1", "uvicorn>=0.54,<1"]
dev = [
    {include-group = "api"},
    "coverage>=7.16,<8",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "pre-commit>=4.6,<5",
    "pytest>=9.1,<10",
    # Starlette's TestClient, for the API's tests. httpx2 rather than httpx,
    # which starlette.testclient now warns about.
    "httpx2>=2.16,<3",
    # Fuzzes the API from its OpenAPI document in CI's db job (#81), and
    # brings Hypothesis, which the optimiser's property tests use (#83).
    "schemathesis>=4.32,<5",
]

[tool.uv]
default-groups = ["dev"]
# The version CI and the image install (.github/actions/uv, Dockerfile); a
# newer uv reads the same lock.
required-version = ">=0.13.0"

# One command per module, each the module's cli(). `python -m fpl.<package>.<module>`
# runs exactly the same function, so the two spellings cannot drift apart.
[project.scripts]
fpl-fetch = "fpl.ingest.fetch:cli"
fpl-predict-baseline = "fpl.models.predict_baseline:cli"
fpl-predict-fixture = "fpl.models.predict_fixture:cli"
fpl-verify = "fpl.log.verify_entry:cli"
fpl-summarise = "fpl.log.summarise:cli"
fpl-score = "fpl.evaluation.score:cli"
fpl-backtest = "fpl.evaluation.backtest:cli"
fpl-entry = "fpl.log.entry:cli"
fpl-load = "fpl.db.load:cli"
fpl-stale = "fpl.db.stale:cli"
fpl-migrate = "fpl.db.migrate:cli"
fpl-optimise = "fpl.optimise:cli"
fpl-project = "fpl.db.project:cli"
fpl-reconcile = "fpl.db.reconcile:cli"
fpl-serve = "fpl.api.serve:cli"

[tool.setuptools]
# Stated rather than discovered, so tests/, tools/, data/ and scratch/ can
# never end up inside the installed package.
packages = [
    "fpl", "fpl.api", "fpl.db", "fpl.db.migrations", "fpl.db.migrations.versions",
    "fpl.evaluation", "fpl.ingest", "fpl.log", "fpl.models",
]

[tool.setuptools.package-data]
"fpl.db.migrations" = ["script.py.mako"]

# Lint, not format. `ruff format` would rewrite most of the repository for no
# change in meaning and bury `git blame` under it, so only `ruff check` runs.
#
# The rule set is deliberately small: pyflakes and pycodestyle errors, import
# order, bugbear and pyupgrade. Each finds real mistakes rather than enforcing
# taste. Line length matches what the code already keeps to.
[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

# Migrations are generated, then formatted, and long constraint expressions
# stay on one line rather than being split by hand.
[tool.ruff.lint.per-file-ignores]
"fpl/db/migrations/versions/*" = ["E501"]

# Coverage is reported in CI's job summary, not gated on: a threshold invites
# tests written for the number.
#
# `patch = subprocess` measures the processes the tests start too.
# tools/check_log_immutable.py is only ever exercised that way, and without it
# reads as untested. Each process writes its own data file, so run
# `coverage combine` before `coverage report`.
[tool.coverage.run]
branch = true
source = ["fpl", "tools"]
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
skip_empty = true

# Types (#76): checked in CI and by pre-commit. Non-strict to start, on fpl/
# only; a module that is fully annotated can opt in to stricter checks below,
# one at a time, rather than the whole package at once.
[tool.pytest.ini_options]
# Only the suite: not scratch/, data/raw/ or anything else that matches test_*.
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
files = ["fpl"]
warn_unused_ignores = true
warn_redundant_casts = true

# highspy ships no type information.
[[tool.mypy.overrides]]
module = ["highspy"]
ignore_missing_imports = true
