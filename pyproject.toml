# The package and its tooling config. What this file does not hold is the lock:
# exact versions, transitive ones included, live in requirements.txt, because
# pyproject has no lockfile and every log entry's reproducibility claim needs
# one. Install with `pip install -r requirements.txt`, which installs those
# pins and then this package, editable — see the comment there for why
# editable is the only supported install.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# fpl/paths.py recognises the repository root by this name, and
# tests/test_paths.py fails if the two drift apart.
name = "fpl-predictor"
version = "0.1.0"
description = "FPL points predictor with an append-only public prediction log"
readme = "README.md"
license = "MIT"
# One Python, as in CI: 3.13 is pinned so an entry can be reproduced from the
# environment that made it.
requires-python = "==3.13.*"
dependencies = ["requests>=2.34,<3"]

# The database layer (#77), installed by requirements-db.txt. Optional so the
# runtime that makes a log entry stays requests alone.
[project.optional-dependencies]
db = ["sqlalchemy>=2.0,<2.1", "alembic>=1.20,<2", "psycopg[binary]>=3.3,<4"]
# The API (#81), with the solver /v1/optimise runs (#83), installed by
# requirements-api.txt.
api = ["fpl-predictor[db,optimise]", "fastapi>=0.159,<1", "uvicorn>=0.54,<1"]
# The squad optimiser (#53), installed by requirements-optimise.txt.
optimise = ["highspy>=1.15,<2"]

# One command per module, each the module's cli(). `python -m fpl.<package>.<module>`
# runs exactly the same function, so the two spellings cannot drift apart.
[project.scripts]
fpl-fetch = "fpl.ingest.fetch:cli"
fpl-predict-baseline = "fpl.models.predict_baseline:cli"
fpl-predict-fixture = "fpl.models.predict_fixture:cli"
fpl-verify = "fpl.log.verify_entry:cli"
fpl-summarise = "fpl.log.summarise:cli"
fpl-score = "fpl.evaluation.score:cli"
fpl-backtest = "fpl.evaluation.backtest:cli"
fpl-entry = "fpl.log.entry:cli"
fpl-load = "fpl.db.load:cli"
fpl-stale = "fpl.db.stale:cli"
fpl-migrate = "fpl.db.migrate:cli"
fpl-optimise = "fpl.optimise:cli"
fpl-project = "fpl.db.project:cli"
fpl-reconcile = "fpl.db.reconcile:cli"
fpl-serve = "fpl.api.serve:cli"

[tool.setuptools]
# Stated rather than discovered, so tests/, tools/, data/ and scratch/ can
# never end up inside the installed package.
packages = [
    "fpl", "fpl.api", "fpl.db", "fpl.db.migrations", "fpl.db.migrations.versions",
    "fpl.evaluation", "fpl.ingest", "fpl.log", "fpl.models",
]

[tool.setuptools.package-data]
"fpl.db.migrations" = ["script.py.mako"]

# Lint, not format. `ruff format` would rewrite most of the repository for no
# change in meaning and bury `git blame` under it, so only `ruff check` runs.
#
# The rule set is deliberately small: pyflakes and pycodestyle errors, import
# order, bugbear and pyupgrade. Each finds real mistakes rather than enforcing
# taste. Line length matches what the code already keeps to.
[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

# Migrations are generated, then formatted, and long constraint expressions
# stay on one line rather than being split by hand.
[tool.ruff.lint.per-file-ignores]
"fpl/db/migrations/versions/*" = ["E501"]

# Coverage is reported in CI's job summary, not gated on: a threshold invites
# tests written for the number.
#
# `patch = subprocess` measures the processes the tests start too.
# tools/check_log_immutable.py is only ever exercised that way, and without it
# reads as untested. Each process writes its own data file, so run
# `coverage combine` before `coverage report`.
[tool.coverage.run]
branch = true
source = ["fpl", "tools"]
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
skip_empty = true
